<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solvia.Nova — Nine Planet Digital Universe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
#space{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#space:active{cursor:grabbing}

.logo span{color:#4c91ff}

.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#61adff;box-shadow:0 0 15px #61adff;margin-right:7px}
.info h1{font-size:clamp(24px,3vw,42px);line-height:1;letter-spacing:-.05em;margin:0 0 12px}.info p{font-size:13px;line-height:1.6;color:#7e94b7;margin:0}
.hint b{color:#76b2ff}
</style>
</head>
<body>
<canvas id="space"></canvas>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

const canvas=document.querySelector("#space");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020611);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,200);
camera.position.set(0,0,27);

const system=new THREE.Group();scene.add(system);

// ---------- helpers ----------
function canvasTexture(draw,w=1024,h=512){
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");draw(x,w,h);return new THREE.CanvasTexture(c);
}
function glowTex(){
 return canvasTexture((x,w,h)=>{
  const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  g.addColorStop(0,"#ffffff");g.addColorStop(.08,"#b9ddff");g.addColorStop(.22,"#5ca4ff99");g.addColorStop(.55,"#2676ff28");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,0,w,h);
 },256,256);
}
const blueGlow=glowTex();

// ---------- star field: visible + twinkling ----------
const starCount=10500;
const starPos=new Float32Array(starCount*3), starCol=new Float32Array(starCount*3), starSize=new Float32Array(starCount);
for(let i=0;i<starCount;i++){
 const r=35+Math.random()*115,a=Math.random()*Math.PI*2,u=Math.random()*2-1,q=Math.sqrt(1-u*u);
 starPos[i*3]=Math.cos(a)*q*r;starPos[i*3+1]=u*r;starPos[i*3+2]=Math.sin(a)*q*r;
 const warm=Math.random()<.12, b=.55+Math.random()*.45;
 starCol[i*3]=warm?b:0.45+b*.35;starCol[i*3+1]=warm?.75+b*.2:.65+b*.3;starCol[i*3+2]=warm?1:1;
 starSize[i]=Math.random()<.04?2.5+Math.random()*3.5:.65+Math.random()*1.5;
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute("position",new THREE.BufferAttribute(starPos,3));
starGeo.setAttribute("color",new THREE.BufferAttribute(starCol,3));
starGeo.setAttribute("aSize",new THREE.BufferAttribute(starSize,1));
const starMat=new THREE.ShaderMaterial({
 transparent:true,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,
 uniforms:{pixelRatio:{value:Math.min(devicePixelRatio,2)}},
 vertexShader:`attribute float aSize;varying vec3 vColor;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*pixelRatio*(180./-mv.z);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying vec3 vColor;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.02,d);float sparkle=1.-smoothstep(.05,.5,d);gl_FragColor=vec4(vColor,a*(.72+sparkle*.28));}`
});
const stars=new THREE.Points(starGeo,starMat);scene.add(stars);

// prominent sparkling stars
const sparkleGroup=new THREE.Group();scene.add(sparkleGroup);
for(let i=0;i<70;i++){
 const a=Math.random()*Math.PI*2,r=16+Math.random()*75,u=Math.random()*2-1,q=Math.sqrt(1-u*u);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:blueGlow,transparent:true,opacity:.45+Math.random()*.45,depthWrite:false,blending:THREE.AdditiveBlending}));
 const sc=.08+Math.random()*.22;s.scale.set(sc,sc,1);
 s.position.set(Math.cos(a)*q*r,u*r,Math.sin(a)*q*r);s.userData.phase=Math.random()*6.28;s.userData.base=sc;sparkleGroup.add(s);
}

// ---------- explicit twinkle stars ----------
const twinkleGroup=new THREE.Group();
scene.add(twinkleGroup);
for(let i=0;i<90;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({
    map:blueGlow,color:0xcfe7ff,transparent:true,opacity:.2+Math.random()*.7,
    depthWrite:false,blending:THREE.AdditiveBlending
  }));
  const r=24+Math.random()*90,a=Math.random()*Math.PI*2,u=Math.random()*2-1,q=Math.sqrt(1-u*u);
  s.position.set(Math.cos(a)*q*r,u*r,Math.sin(a)*q*r);
  const base=.025+Math.random()*.07;
  s.scale.set(base,base,1);
  s.userData={phase:Math.random()*Math.PI*2,speed:.7+Math.random()*2.2,base};
  twinkleGroup.add(s);
}

// ---------- galaxy spiral ----------
const N=70000,p=new Float32Array(N*3),c=new Float32Array(N*3);
const cBlue=new THREE.Color(0x5799ff),cPale=new THREE.Color(0xc8e3ff),cDeep=new THREE.Color(0x245ed0);
for(let i=0;i<N;i++){
 const r=Math.pow(Math.random(),.68)*13.5;
 const arm=i%5;
 const a=arm*Math.PI*2/5+r*.58+(Math.random()-.5)*(.12+.035*r);
 const spread=(Math.random()-.5)*(.14+.045*r);
 p[i*3]=Math.cos(a)*r+Math.cos(a+Math.PI/2)*spread;
 p[i*3+1]=(Math.random()-.5)*(.15+.035*r);
 p[i*3+2]=Math.sin(a)*r+Math.sin(a+Math.PI/2)*spread;
 const z=Math.random(),cc=z<.12?cPale:z<.66?cBlue:cDeep;
 c[i*3]=cc.r;c[i*3+1]=cc.g;c[i*3+2]=cc.b;
}
const gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.BufferAttribute(p,3));gg.setAttribute("color",new THREE.BufferAttribute(c,3));
system.add(new THREE.Points(gg,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending})));

// ---------- central Solvia ----------
const coreGroup=new THREE.Group();system.add(coreGroup);
const core=new THREE.Mesh(new THREE.SphereGeometry(1.15,64,64),new THREE.MeshPhysicalMaterial({color:0x0b2d70,emissive:0x1260d9,emissiveIntensity:2,metalness:.15,roughness:.2,clearcoat:1}));
coreGroup.add(core);
const coreHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:blueGlow,transparent:true,opacity:.92,depthWrite:false,blending:THREE.AdditiveBlending}));coreHalo.scale.set(5.2,5.2,1);coreGroup.add(coreHalo);
const coreLight=new THREE.PointLight(0x4c9aff,20,30,2);coreGroup.add(coreLight);

const orbitGuide=new THREE.Sprite(new THREE.SpriteMaterial({
 map:blueGlow,transparent:true,opacity:.10,depthWrite:false,blending:THREE.AdditiveBlending
}));
orbitGuide.scale.set(3.0,3.0,1);
system.add(orbitGuide);

// ---------- 9 planets with clear individual revolution paths ----------
const data=[
 ["VISION","STRATEGY",3.0,.46,0x6aaeff],
 ["BRAND","IDENTITY",4.15,.50,0x82bdff],
 ["WEB","EXPERIENCE",5.35,.43,0x4f91ff],
 ["SOFTWARE","ENGINEERING",6.65,.55,0x73b2ff],
 ["AI","INTELLIGENCE",8.0,.46,0x5f9eff],
 ["AUTOMATION","WORKFLOW",9.35,.52,0x3978e8],
 ["DATA","ANALYTICS",10.8,.44,0x79b8ff],
 ["CLOUD","INFRASTRUCTURE",12.2,.56,0x4b8df5],
 ["FUTURE","INNOVATION",13.7,.47,0x8ac5ff]
];

function makeLabel(a,b){
 return canvasTexture((x,w,h)=>{
  x.textAlign="center";x.textBaseline="middle";
  x.font="800 38px Inter,Arial";x.fillStyle="#edf6ff";x.fillText(a,w/2,80);
  x.font="500 21px Inter,Arial";x.fillStyle="#73a9e9";x.fillText(b,w/2,132);
 },700,210);
}

const planets=[];

data.forEach((d,i)=>{
 const [title,sub,radius,size,color]=d;

 const orbit=new THREE.Group();
 system.add(orbit);

 const ring=new THREE.Mesh(
   new THREE.TorusGeometry(radius,.010,8,384),
   new THREE.MeshBasicMaterial({
     color:0x6aaaff,
     transparent:true,
     opacity:.38,
     blending:THREE.AdditiveBlending,
     depthWrite:false
   })
 );
 orbit.add(ring);

 const ringGlow=new THREE.Mesh(
   new THREE.TorusGeometry(radius,.028,8,384),
   new THREE.MeshBasicMaterial({
     color:0x3d82ff,
     transparent:true,
     opacity:.055,
     blending:THREE.AdditiveBlending,
     depthWrite:false
   })
 );
 orbit.add(ringGlow);

 const pivot=new THREE.Group();
 pivot.rotation.y=(i*0.73);
 orbit.add(pivot);

 const planet=new THREE.Mesh(
   new THREE.SphereGeometry(size,32,32),
   new THREE.MeshPhysicalMaterial({
     color:color,
     emissive:color,
     emissiveIntensity:.55,
     roughness:.25,
     metalness:.2,
     clearcoat:1
   })
 );
 planet.position.set(radius,0,0);
 planet.userData.isPlanet=true;
 planet.userData.title=title;
 pivot.add(planet);

 const haloP=new THREE.Sprite(
   new THREE.SpriteMaterial({
     map:blueGlow,
     transparent:true,
     opacity:.46,
     depthWrite:false,
     blending:THREE.AdditiveBlending
   })
 );
 haloP.scale.set(size*3.2,size*3.2,1);
 planet.add(haloP);

 const label=new THREE.Sprite(
   new THREE.SpriteMaterial({
     map:makeLabel(title,sub),
     transparent:true,
     depthWrite:false
   })
 );
 label.scale.set(1.72,.51,1);
 label.position.set(0,size+0.44,0);
 planet.add(label);

 planets.push({
   orbit,
   pivot,
   planet,
   halo:haloP,
   orbitalSpeed:.0008+(9-i)*.00011,
   selfSpeed:.006+(i%3)*.001
 });
});

// ---------- interaction ----------
let rx=.28,ry=0,zoom=27,drag=false,lx=0,ly=0,auto=true,pulse=0;
canvas.addEventListener("pointerdown",e=>{drag=true;auto=false;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointermove",e=>{if(!drag)return;ry+=(e.clientX-lx)*.003;rx+=(e.clientY-ly)*.0022;rx=Math.max(-.65,Math.min(.85,rx));lx=e.clientX;ly=e.clientY});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(16,Math.min(38,zoom+e.deltaY*.012));auto=false},{passive:false});
canvas.addEventListener("dblclick",()=>auto=true);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
canvas.addEventListener("click",e=>{
 mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
 if(ray.intersectObject(core,true).length){pulse=1;auto=false}
});
let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- visible meteor every 10 seconds ----------
const meteorGroup=new THREE.Group();
scene.add(meteorGroup);
const meteors=[];
const meteorTexture=glowTex();

function makeMeteor(){
  const head=new THREE.Sprite(new THREE.SpriteMaterial({
    map:meteorTexture,color:0xbfe3ff,transparent:true,opacity:0,
    depthWrite:false,blending:THREE.AdditiveBlending
  }));
  head.scale.set(.34,.34,1);

  const lineGeo=new THREE.BufferGeometry();
  lineGeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(6),3));
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({
    color:0x73b7ff,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));

  meteorGroup.add(line);
  meteorGroup.add(head);

  const m={head,line,life:0,active:false,duration:1.15,velocity:new THREE.Vector3()};
  meteors.push(m);
  return m;
}
for(let i=0;i<8;i++)makeMeteor();

function launchMeteor(){
  const m=meteors.find(x=>!x.active)||meteors[0];
  const start=new THREE.Vector3(
    -17+Math.random()*10,
    8+Math.random()*8,
    8+Math.random()*7
  );
  const velocity=new THREE.Vector3(
    10+Math.random()*5,
    -8-Math.random()*5,
    -1-Math.random()*2
  );

  m.head.position.copy(start);
  m.velocity.copy(velocity);
  m.life=0;
  m.duration=1.15;
  m.active=true;
  m.head.material.opacity=1;
  m.line.material.opacity=.9;
}

let meteorTimer=10;
function updateMeteors(dt){
  meteorTimer-=dt;
  if(meteorTimer<=0){
    launchMeteor();
    meteorTimer=10;
  }

  meteors.forEach(m=>{
    if(!m.active)return;

    m.life+=dt;
    m.head.position.addScaledVector(m.velocity,dt);

    const dir=m.velocity.clone().normalize();
    const tail=m.head.position.clone().addScaledVector(dir,-4.8);

    const arr=m.line.geometry.attributes.position.array;
    arr[0]=m.head.position.x;
    arr[1]=m.head.position.y;
    arr[2]=m.head.position.z;
    arr[3]=tail.x;
    arr[4]=tail.y;
    arr[5]=tail.z;
    m.line.geometry.attributes.position.needsUpdate=true;

    const progress=m.life/m.duration;
    const fade=progress<.15 ? progress/.15 : 1-progress;

    m.head.material.opacity=Math.max(0,fade);
    m.line.material.opacity=Math.max(0,.9*fade);

    if(progress>=1){
      m.active=false;
      m.head.material.opacity=0;
      m.line.material.opacity=0;
    }
  });
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;updateMeteors(dt);
 if(auto)ry+=.00055;
 system.rotation.x+=(rx-system.rotation.x)*.035;system.rotation.y+=(ry-system.rotation.y)*.035;
 system.rotation.z=Math.sin(t*.1)*.01;
 planets.forEach((p,i)=>{
   p.pivot.rotation.y+=p.orbitalSpeed;
   p.planet.rotation.y+=p.selfSpeed;
   p.halo.material.opacity=.34+Math.sin(t*1.25+i)*.08;
 });
 starMat.opacity=.78+Math.sin(t*.8)*.08;
 twinkleGroup.children.forEach(s=>{
   const q=.15+.85*(.5+.5*Math.sin(t*s.userData.speed+s.userData.phase));
   s.material.opacity=q;
   s.scale.setScalar(s.userData.base*(.65+q*1.6));
 });
 sparkleGroup.children.forEach((s,i)=>{const q=.72+Math.sin(t*(1.2+(i%4)*.23)+s.userData.phase)*.28;s.material.opacity=q;s.scale.setScalar(s.userData.base*(.85+q*.5))});
 core.rotation.y+=.0014;
 if(pulse>0){pulse*=.91;core.scale.setScalar(1+pulse*.3);coreLight.intensity=20+pulse*75;coreHalo.scale.setScalar(5.2+pulse*4)}
 else{core.scale.setScalar(1+Math.sin(t*1.5)*.018);coreLight.intensity=20+Math.sin(t)*2;coreHalo.scale.setScalar(5.2+Math.sin(t*.8)*.15)}
 camera.position.z+=(zoom-camera.position.z)*.045;
 camera.position.x+=(mx*.7-camera.position.x)*.018;camera.position.y+=(-my*.5-camera.position.y)*.018;
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
